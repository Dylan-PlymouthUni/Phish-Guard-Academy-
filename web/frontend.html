<!doctype html>
<html>
<head><meta charset="utf-8"><title>Phish-Guard Demo</title></head>
<body>
  <h2>Upload screenshot / image</h2>
  <input id="file" type="file" accept="image/*"><button id="analyze">Analyze</button>
  <h3>Annotated image</h3>
  <img id="annot" style="max-width:90%;border:1px solid #ccc">
  <h3>Results (JSON)</h3>
  <pre id="json"></pre>

<script>
document.getElementById('analyze').onclick = async () => {
  const f = document.getElementById('file').files[0];
  if (!f) return alert('Choose a file');
  const fd = new FormData(); fd.append('file', f);
  // analyze_image -> JSON with URLs & scores
  const res = await fetch('/analyze_image', { method: 'POST', body: fd });
  const data = await res.json();
  document.getElementById('json').textContent = JSON.stringify(data, null, 2);

  // get annotated image
  const fd2 = new FormData(); fd2.append('file', f);
  const res2 = await fetch('/annotated_image', { method: 'POST', body: fd2 });
  const blob = await res2.blob();
  document.getElementById('annot').src = URL.createObjectURL(blob);
};
</script>
</body>
</html>
