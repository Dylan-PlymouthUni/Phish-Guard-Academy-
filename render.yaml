services:
  - type: web
    name: phishguard-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: phishguard-frontend
    env: node
    plan: free
    buildCommand: cd phish-guard-academy && npm install && npm run build
    startCommand: cd phish-guard-academy && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://phishguard-api.onrender.com
    autoDeploy: true

databases:
  - name: phishguard-db
    plan: free
    ipAllowList: []  # Allow all IPs from render.com
