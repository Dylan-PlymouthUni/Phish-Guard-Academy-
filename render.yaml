services:
  - type: web
    name: phishguard-academy
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn ml.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        value: changeme
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
    autoDeploy: true
