<!DOCTYPE html>
<!--
  Browser extension popup UI layout and controls.
  Provides a user interface for analyzing URLs, viewing results, and adjusting settings.
-->

<html>
<head>
  <meta charset="UTF-8">
  <title>PhishGuard Analyzer</title>
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
    }
    .analyze-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result {
      margin-top: 16px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      display: none;
    }
    .result.show {
      display: block;
    }
    .risk-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .risk-high {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .risk-medium {
      background: rgba(249, 115, 22, 0.2);
      color: #f97316;
    }
    .risk-safe {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }
    .findings {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 8px;
    }
    .findings li {
      margin: 4px 0;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .quick-btn {
      padding: 8px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      color: #93c5fd;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .quick-btn:hover {
      background: rgba(59, 130, 246, 0.2);
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
    }
    .settings-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }
    .settings-grid {
      display: grid;
      gap: 10px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .setting-row select {
      width: auto;
      min-width: 130px;
    }
    .setting-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
    }
    .settings-note {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️ PhishGuard</div>
    <div class="subtitle">AI-Powered Phishing Detection</div>
  </div>

  <div class="quick-actions">
    <div class="quick-btn" id="checkCurrentPage">Check This Page</div>
    <div class="quick-btn" id="openDashboard">Open Dashboard</div>
  </div>

  <div class="analyze-section">
    <div class="input-group">
      <label for="urlInput">Analyze URL</label>
      <input type="text" id="urlInput" placeholder="Enter URL to analyze...">
    </div>
    <button id="analyzeBtn">Analyze URL</button>
  </div>

  <div class="result" id="result">
    <div id="resultContent"></div>
  </div>

  <div class="loading" id="loading" style="display:none;">
    Analyzing...
  </div>

  <div class="settings-section">
    <div class="subtitle" style="margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.08em;">Extension Defaults</div>
    <div class="settings-grid">
      <div class="setting-row">
        <label for="sensitivitySelect">Sensitivity</label>
        <select id="sensitivitySelect">
          <option value="strict">Strict</option>
          <option value="balanced">Balanced</option>
          <option value="relaxed">Relaxed</option>
        </select>
      </div>
      <div class="setting-row">
        <label for="autoScanToggle">Auto-scan pages</label>
        <input type="checkbox" id="autoScanToggle">
      </div>
      <div class="setting-row">
        <label for="inlineWarningsToggle">Inline warnings</label>
        <input type="checkbox" id="inlineWarningsToggle">
      </div>
      <div class="setting-row">
        <label for="badgeAlertsToggle">Badge alerts</label>
        <input type="checkbox" id="badgeAlertsToggle">
      </div>
    </div>
    <div class="settings-note">
      These controls affect background page scanning, badge behavior, and page-level warning banners inside the extension.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
